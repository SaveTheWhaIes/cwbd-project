repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - docs/CONTRIBUTING.md
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-cwbd-project_logo_light.png
    - docs/images/nf-core-cwbd-project_logo_light.png
    - docs/images/nf-core-cwbd-project_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-cwbd-project_logo_light.png
    - docs/images/nf-core-cwbd-project_logo_light.png
    - docs/images/nf-core-cwbd-project_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: SaveTheWhaIes
  name: cwbdproject
  description: RNA-seq workflow, from reads to differential expression
  author: Laurens Hahn, Miriam Beermann
  version: 1.0.0dev
  force: true
  outdir: /home/laurens/repositories/bioinfo/projects/cwbd-project
  skip_features:
    - igenomes
    - gpu
    - codespaces
    - email
  is_nfcore: false
